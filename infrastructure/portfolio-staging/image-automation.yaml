apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: portfolio-frontend
  namespace: flux-system
spec:
  image: ghcr.io/noxels/portfolio-frontend@sha256:2be0aed1b82d2ed97511a0c86c339354f73d23c551a7d91d1a2f49ed443afd3a
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portfolio-staging
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portfolio-frontend
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+-staging\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0-0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: portfolio-staging
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@sisyphus.local
        name: Flux
      messageTemplate: |
        chore(portfolio): update staging image

        {{- range .Changed.Changes -}}
        {{ print .OldValue }} -> {{ println .NewValue }}
        {{- end }}
    push:
      # Flux updates are reviewed through a GitHub PR before main changes.
      branch: flux/portfolio-staging-image
  update:
    path: ./infrastructure/portfolio-staging
    strategy: Setters

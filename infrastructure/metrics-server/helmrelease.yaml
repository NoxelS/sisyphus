apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  releaseName: metrics-server
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: kube-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 1
    args:
      # The current Talos kubelet uses a node-local CA and has no IP SAN.
      # Remove this when CA-signed kubelet serving certificates are configured.
      - --kubelet-insecure-tls
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        memory: 400Mi

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kite
  namespace: kite
spec:
  interval: 30m
  chart:
    spec:
      chart: kite
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: kite
        namespace: kite
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    host: https://kite.noel.fyi
    anonymousUserEnabled: false
    secret:
      create: false
      existingSecret: kite-secrets
    db:
      type: postgres
    ingress:
      enabled: false
    gateway:
      enabled: false

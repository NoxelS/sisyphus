apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portfolio-production
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portfolio-frontend
  filterTags:
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  policy:
    semver:
      range: '>=0.0.1'
  digestReflectionPolicy: IfNotPresent
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: portfolio-production
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@sisyphus.local
        name: Flux
      messageTemplate: |
        chore(portfolio): update production image

        {{ range .Changed.Changes -}}
        {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: flux/portfolio-production-image
  update:
    path: ./infrastructure/portfolio-production
    strategy: Setters

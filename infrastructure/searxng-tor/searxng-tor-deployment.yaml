apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-tor
  namespace: malg
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/instance: searxng-tor
    app.kubernetes.io/part-of: malg
    app.kubernetes.io/component: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
      app.kubernetes.io/instance: searxng-tor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/instance: searxng-tor
        app.kubernetes.io/part-of: malg
        app.kubernetes.io/component: search
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:latest@sha256:a31763b7af3caf6ae9aac1816ba774214eb550252e06a4998f276ded8d60461b
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: malg-runtime
                  key: SEARXNG_SECRET
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/searxng
      volumes:
        - name: settings
          configMap:
            name: searxng-tor-settings
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi

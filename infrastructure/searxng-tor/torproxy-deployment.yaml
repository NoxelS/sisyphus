apiVersion: apps/v1
kind: Deployment
metadata:
  name: torproxy
  namespace: malg
  labels:
    app.kubernetes.io/name: torproxy
    app.kubernetes.io/instance: torproxy
    app.kubernetes.io/part-of: malg
    app.kubernetes.io/component: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: torproxy
      app.kubernetes.io/instance: torproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: torproxy
        app.kubernetes.io/instance: torproxy
        app.kubernetes.io/part-of: malg
        app.kubernetes.io/component: search
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: torproxy
          image: docker.io/hapheus/torproxy:v2.5.0@sha256:719c4cf9dd9cbda226132591750ab1c1fff1a53e40f074cde85fa76024a964b9
          imagePullPolicy: IfNotPresent
          ports:
            - name: socks
              containerPort: 9050
              protocol: TCP
            - name: api
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /status
              port: api
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ip
              port: api
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tor-config
              mountPath: /etc/tor/torrc
              subPath: torrc
              readOnly: true
      volumes:
        - name: tor-config
          configMap:
            name: torproxy-config

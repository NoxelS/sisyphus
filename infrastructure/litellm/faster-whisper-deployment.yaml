apiVersion: apps/v1
kind: Deployment
metadata:
  name: faster-whisper
  namespace: litellm
  labels:
    app.kubernetes.io/name: faster-whisper
    app.kubernetes.io/instance: faster-whisper
    app.kubernetes.io/component: transcription
    app.kubernetes.io/part-of: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: faster-whisper
      app.kubernetes.io/instance: faster-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faster-whisper
        app.kubernetes.io/instance: faster-whisper
        app.kubernetes.io/component: transcription
        app.kubernetes.io/part-of: litellm
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: preload-model
          image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              uvicorn --factory speaches.main:create_app &
              preload_server_pid=$!;
              trap 'kill "$preload_server_pid" 2>/dev/null || true' EXIT;
              until curl --fail --silent --output /dev/null
              --header "Authorization: Bearer ${API_KEY}"
              http://127.0.0.1:8000/health; do sleep 1; done;
              curl --fail --silent --show-error --max-time 900
              --request POST
              --header "Authorization: Bearer ${API_KEY}"
              http://127.0.0.1:8000/v1/models/Systran/faster-whisper-small
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: faster-whisper-runtime
                  key: API_KEY
            - name: ENABLE_UI
              value: "false"
            - name: LOG_LEVEL
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: model-cache
              mountPath: /home/ubuntu/.cache/huggingface
            - name: tmp
              mountPath: /tmp
      containers:
        - name: faster-whisper
          image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
          imagePullPolicy: IfNotPresent
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: faster-whisper-runtime
                  key: API_KEY
            - name: ENABLE_UI
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: WHISPER__INFERENCE_DEVICE
              value: cpu
            - name: WHISPER__COMPUTE_TYPE
              value: int8
            - name: WHISPER__CPU_THREADS
              value: "4"
            - name: WHISPER__NUM_WORKERS
              value: "1"
            - name: WHISPER__TTL
              value: "-1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  curl --fail --silent --output /dev/null
                  --header "Authorization: Bearer ${API_KEY}"
                  http://127.0.0.1:8000/health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  curl --fail --silent --output /dev/null
                  --header "Authorization: Bearer ${API_KEY}"
                  http://127.0.0.1:8000/health
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  curl --fail --silent --output /dev/null
                  --header "Authorization: Bearer ${API_KEY}"
                  http://127.0.0.1:8000/health
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: model-cache
              mountPath: /home/ubuntu/.cache/huggingface
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: faster-whisper-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi

apiVersion: v1
kind: Service
metadata:
  name: litellm-metrics
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: litellm
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: litellm
  ports:
    - name: metrics
      port: 4001
      targetPort: 4001
      protocol: TCP

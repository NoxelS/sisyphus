apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: litellm
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: postgresql
    namespace: litellm
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    architecture: standalone
    image:
      registry: registry-1.docker.io
      repository: bitnami/postgresql
      # Keep the digest in tag for Renovate; disable the chart digest override.
      tag: latest@sha256:e19e264c3370e9c8bd87ce0421077b25b3c62b0b6fadf98b01c18cdb9252e0da
      digest: ""
    auth:
      existingSecret: postgresql-credentials
      username: litellm
      database: litellm
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      persistence:
        enabled: true
        storageClass: local-path
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

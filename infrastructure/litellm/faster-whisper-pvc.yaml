apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faster-whisper-model-cache
  namespace: litellm
  labels:
    app.kubernetes.io/name: faster-whisper
    app.kubernetes.io/instance: faster-whisper
    app.kubernetes.io/component: transcription
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

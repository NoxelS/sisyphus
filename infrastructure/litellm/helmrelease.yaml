apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 30m
  dependsOn:
    - name: postgresql
    - name: redis
  chartRef:
    kind: OCIRepository
    name: litellm
    namespace: litellm
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: litellm
    replicaCount: 1
    numWorkers: 1
    image:
      repository: ghcr.io/berriai/litellm
      tag: v1.100.0@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      automount: false
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    terminationGracePeriodSeconds: 90
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
    environmentSecrets:
      - litellm-runtime
      - redis-credentials
    service:
      type: ClusterIP
      port: 4000
    ingress:
      enabled: false
    masterkeySecretName: litellm-runtime
    masterkeySecretKey: masterkey
    proxy_config:
      model_list:
        - model_name: qwen3.8-27b
          litellm_params:
            model: openai/qwen3.8-27b
            api_base: https://api.solheim.ai/v1
            api_key: os.environ/SOLHEIM_API_KEY
            max_parallel_requests: 3
            # Comparable on-demand benchmark: Alibaba Cloud Model Studio
            # international Qwen3.8-27B pricing ($0.50/$3.00 per 1M tokens).
            # Solheim bills this endpoint as a flat-rate subscription.
            input_cost_per_token: 0.0000005
            output_cost_per_token: 0.000003
          model_info:
            mode: chat
            max_input_tokens: 262144
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        store_model_in_db: true
        store_prompts_in_spend_logs: true
        proxy_batch_write_at: 60
        database_connection_pool_limit: 10
        disable_error_logs: true
        user_api_key_cache_ttl: 300
      guardrails:
        - guardrail_name: headroom-compression
          litellm_params:
            guardrail: headroom
            mode: pre_call
            api_base: http://headroom:8787
      litellm_settings:
        callbacks:
          - prometheus
          - smtp_email
        cache: true
        enable_redis_auth_cache: true
        cache_params:
          type: redis
          host: os.environ/REDIS_HOST
          port: os.environ/REDIS_PORT
          password: os.environ/REDIS_PASSWORD
          namespace: sisyphus-litellm
          ttl: 600
          mode: default_off
          max_connections: 100
        request_timeout: 600
        set_verbose: false
        json_logs: true
        turn_off_message_logging: false
        require_auth_for_metrics_endpoint: true
        key_generation_settings:
          team_key_generation:
            allowed_team_member_roles:
              - admin
          personal_key_generation:
            allowed_user_roles:
              - proxy_admin
      router_settings:
        routing_strategy: simple-shuffle
        redis_host: os.environ/REDIS_HOST
        redis_port: os.environ/REDIS_PORT
        redis_password: os.environ/REDIS_PASSWORD
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "1"
        memory: 4Gi
    autoscaling:
      enabled: false
    keda:
      enabled: false
    pdb:
      enabled: false
    db:
      useExisting: true
      endpoint: postgresql:5432
      database: litellm
      secret:
        name: postgresql-credentials
        usernameKey: username
        passwordKey: password
      deployStandalone: false
    migrationJob:
      enabled: true
      retries: 3
      backoffLimit: 4
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 300
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 4Gi
      hooks:
        argocd:
          enabled: false
        helm:
          enabled: true
    logLevel: INFO
    envVars:
      LITELLM_MODE: PRODUCTION
      PROXY_BASE_URL: https://ai.noel.fyi
      UI_USERNAME: admin
      SMTP_HOST: smtp.protonmail.ch
      SMTP_TLS: "True"
      SMTP_PORT: "587"
      SMTP_USERNAME: ai@noel.fyi
      SMTP_SENDER_EMAIL: ai@noel.fyi
      EMAIL_INCLUDE_API_KEY: "false"
      REDIS_HOST: redis-master
      REDIS_PORT: "6379"

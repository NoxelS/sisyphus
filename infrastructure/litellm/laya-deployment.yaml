apiVersion: apps/v1
kind: Deployment
metadata:
  name: laya
  namespace: litellm
spec:
  replicas: 1
  # The single node cannot afford two resident checkpoints during an upgrade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: laya
      app.kubernetes.io/instance: laya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laya
        app.kubernetes.io/instance: laya
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: laya
          image: ghcr.io/noxels/sisyphus-laya-english@sha256:1268aba1f83f11e0214a4edb171a2ea045b4a651ce93d21cf0cce57e61d19bdd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: laya-runtime
          resources:
            requests:
              cpu: 250m
              memory: 1152Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

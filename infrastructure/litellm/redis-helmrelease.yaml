apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: litellm
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: redis
    namespace: litellm
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: redis
    architecture: standalone
    image:
      registry: registry-1.docker.io
      repository: bitnami/redis
      # Keep the digest in tag for Renovate; disable the chart digest override.
      tag: latest@sha256:e153201276f043fefa579941a7b5ffa2ee4c67e23bc1ad34b43374d14a36d4cb
      digest: ""
    auth:
      enabled: true
      existingSecret: redis-credentials
      existingSecretPasswordKey: REDIS_PASSWORD
      usePasswordFiles: true
    commonConfiguration: |-
      appendonly no
      save ""
      maxmemory 192mb
      maxmemory-policy volatile-lru
    networkPolicy:
      enabled: false
    master:
      persistence:
        enabled: false
        sizeLimit: 512Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

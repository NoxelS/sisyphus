apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: litellm
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: redis
    namespace: litellm
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: redis
    architecture: standalone
    image:
      registry: registry-1.docker.io
      repository: bitnami/redis
      # This chart publishes `latest`; digest is the immutable source of truth.
      tag: latest@sha256:37c559e3894161f1b1122353a54938e30299383ae801417debda7d3e7d69490a
      digest: sha256:33dbb7a4be39e73f0d5178e9040061ecb708946f55169657aa6897ba0a2c71d9
    auth:
      enabled: true
      existingSecret: redis-credentials
      existingSecretPasswordKey: REDIS_PASSWORD
      usePasswordFiles: true
    commonConfiguration: |-
      appendonly no
      save ""
      maxmemory 192mb
      maxmemory-policy volatile-lru
    networkPolicy:
      enabled: false
    master:
      persistence:
        enabled: false
        sizeLimit: 512Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

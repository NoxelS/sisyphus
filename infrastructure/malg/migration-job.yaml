apiVersion: batch/v1
kind: Job
metadata:
  name: malg-migration
  namespace: malg
  labels:
    app.kubernetes.io/name: malg-migration
    app.kubernetes.io/part-of: malg
    app.kubernetes.io/component: migration
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: malg-migration
        app.kubernetes.io/part-of: malg
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: database-ready
          image: ghcr.io/noxels/malg:v0.14.0@sha256:9dcae803cb74cd9c4146ce7e5af0e0cf7956d12eb518e24e4602beb53947148e # {"$imagepolicy": "flux-system:malg"}
          command:
            - python
            - -c
            - |
              import os
              import time
              import psycopg

              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+psycopg://", "postgresql://", 1
              )
              for attempt in range(300):
                  try:
                      with psycopg.connect(url, connect_timeout=1) as conn:
                          with conn.cursor() as cur:
                              cur.execute("SELECT 1")
                      break
                  except Exception:
                      if attempt == 299:
                          raise
                      time.sleep(1)
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql:5432/malg
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: migration
          image: ghcr.io/noxels/malg:v0.14.0@sha256:9dcae803cb74cd9c4146ce7e5af0e0cf7956d12eb518e24e4602beb53947148e # {"$imagepolicy": "flux-system:malg"}
          command: ["alembic", "upgrade", "20260924_01"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql:5432/malg
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi

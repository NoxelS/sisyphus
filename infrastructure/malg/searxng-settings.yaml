apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: malg
data:
  settings.yml: |
    use_default_settings: true

    general:
      debug: false
      instance_name: "MALG private search"

    search:
      safe_search: 2
      autocomplete: ""
      formats:
        - json

    server:
      secret_key: "not-used-with-searxng-secret-environment-variable"
      limiter: false
      public_instance: false
      image_proxy: false
      method: "GET"

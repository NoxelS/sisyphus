apiVersion: apps/v1
kind: Deployment
metadata:
  name: malg-worker
  namespace: malg
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: malg-worker
    app.kubernetes.io/part-of: malg
    app.kubernetes.io/component: worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/instance: malg-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/instance: malg-worker
        app.kubernetes.io/part-of: malg
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/noxels/malg:v0.6.0 # {"$imagepolicy": "flux-system:malg"}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "malg.worker"]
          envFrom:
            - configMapRef:
                name: runtime-config
            - secretRef:
                name: malg-runtime
          env:
            - name: MALG_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: username
            - name: MALG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://$(MALG_DB_USER):$(MALG_DB_PASSWORD)@postgresql:5432/malg
            - name: HOME
              value: /home/malg
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/malg
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 16Mi

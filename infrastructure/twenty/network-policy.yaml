apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: twenty-server
  namespace: twenty
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: server
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare-tunnel
            k8s:app.kubernetes.io/name: cloudflared
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: twenty
            k8s:app.kubernetes.io/name: postgresql
            k8s:app.kubernetes.io/instance: postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: twenty
            k8s:app.kubernetes.io/name: redis
            k8s:app.kubernetes.io/instance: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: twenty
            k8s:app.kubernetes.io/name: minio
            k8s:app.kubernetes.io/instance: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: smtp.protonmail.ch
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
---

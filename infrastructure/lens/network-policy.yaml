apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lens
  namespace: lens
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: lens
      app.kubernetes.io/component: lens
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare-tunnel
            k8s:app.kubernetes.io/name: cloudflared
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            k8s:app.kubernetes.io/name: litellm
            k8s:app.kubernetes.io/instance: litellm
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            k8s:app.kubernetes.io/name: litellm
            k8s:app.kubernetes.io/instance: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lens
            k8s:app.kubernetes.io/instance: lens
            k8s:app.kubernetes.io/component: lens-clickhouse
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lens-clickhouse
  namespace: lens
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: lens
      app.kubernetes.io/component: lens-clickhouse
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lens
            k8s:app.kubernetes.io/instance: lens
            k8s:app.kubernetes.io/component: lens
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
  egress: []

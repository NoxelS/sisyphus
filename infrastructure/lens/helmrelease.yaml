apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lens
  namespace: lens
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: lens
    namespace: lens
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # The chart creates this Secret itself. SOPS owns it in Git instead.
          - target:
              version: v1
              kind: Secret
              name: lens-clickhouse
            patch: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: lens-clickhouse
              $patch: delete
          # Lens chart 0.4.0 has no extra environment values.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: lens
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: lens
              spec:
                template:
                  spec:
                    containers:
                      - name: lens
                        env:
                          - name: LENS_GATEWAY_API_BASE
                            value: http://litellm.litellm.svc.cluster.local:4000
                          - name: LENS_GATEWAY_API_KEY
                            valueFrom:
                              secretKeyRef:
                                name: lens-model-gateway
                                key: api-key
  values:
    publicUrl: https://lens.noel.fyi
    ingestionUrl: https://lens.noel.fyi
    adminTokenSecret:
      name: lens-admin
    gateway:
      enabled: true
      secretName: lens-connection
    serviceTokenSecret:
      name: lens-connection
    clickhouse:
      storageClassName: local-path
      storage: 20Gi
    retentionDays: 14

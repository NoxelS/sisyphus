apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: proton-email
  namespace: monitoring
  labels:
    alertmanager: monitoring
spec:
  route:
    receiver: discard
    groupBy:
      - alertname
      - namespace
      - severity
      - source
    groupWait: 5m
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      - receiver: proton-email
        matchers:
          - name: severity
            matchType: "="
            value: critical
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h
      - receiver: proton-email
        matchers:
          - name: severity
            matchType: "="
            value: warning
        groupWait: 5m
        groupInterval: 5m
        repeatInterval: 12h
      - receiver: proton-email
        matchers:
          - name: source
            matchType: "="
            value: flux
          - name: severity
            matchType: "="
            value: error
        groupWait: 1m
        groupInterval: 5m
        repeatInterval: 6h
      - receiver: proton-email
        matchers:
          - name: source
            matchType: "="
            value: flux
          - name: severity
            matchType: "="
            value: info
        groupWait: 2m
        groupInterval: 5m
        repeatInterval: 24h
  receivers:
    - name: discard
    - name: proton-email
      emailConfigs:
        - to: noel@schwabenland.ch
          from: sisyphus@noel.fyi
          smarthost: smtp.protonmail.ch:587
          authUsername: sisyphus@noel.fyi
          authIdentity: sisyphus@noel.fyi
          authPassword:
            name: proton-smtp
            key: smtp-password
          requireTLS: true
          forceImplicitTLS: false
          sendResolved: true
          headers:
            - key: Subject
              value: '[Sisyphus][{{ .Status | toUpper }}][{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}'
          threading:
            threadByDate: Daily

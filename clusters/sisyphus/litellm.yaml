apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/litellm
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: postgresql
      namespace: litellm
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: redis
      namespace: litellm
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: litellm
      namespace: litellm
    - apiVersion: apps/v1
      kind: Deployment
      name: laya
      namespace: litellm
    - apiVersion: apps/v1
      kind: Deployment
      name: headroom
      namespace: litellm
  timeout: 25m
  dependsOn:
    - name: storage
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age

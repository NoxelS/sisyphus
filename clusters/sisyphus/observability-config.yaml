apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/observability-config
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: observability
    - name: litellm
  sourceRef:
    kind: GitRepository
    name: flux-system

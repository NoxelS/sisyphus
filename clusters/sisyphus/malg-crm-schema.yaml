apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: malg-crm-schema
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/malg/crm-schema
  prune: true
  force: true
  wait: true
  timeout: 15m
  dependsOn:
    - name: twenty
      readyExpr: >-
        dep.status.conditions.exists(e, e.type == 'Ready' && e.status == 'True') &&
        dep.metadata.generation == dep.status.observedGeneration
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age

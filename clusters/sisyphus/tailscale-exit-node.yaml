apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-exit-node
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/tailscale-exit-node
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: tailscale
  sourceRef:
    kind: GitRepository
    name: flux-system

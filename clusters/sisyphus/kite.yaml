apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kite
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/kite
  prune: true
  wait: true
  dependsOn:
    - name: storage
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age

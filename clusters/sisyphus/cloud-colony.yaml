apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloud-colony
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/cloud-colony
  prune: true
  timeout: 5m
  dependsOn:
    - name: litellm
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: hello-world
      namespace: cloud-colony

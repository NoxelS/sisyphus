apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: twenty
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/twenty
  prune: true
  wait: true
  timeout: 20m
  dependsOn:
    - name: storage
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age

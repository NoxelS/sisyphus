apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lens
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/lens
  prune: true
  timeout: 20m
  dependsOn:
    - name: storage
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: lens
      namespace: lens

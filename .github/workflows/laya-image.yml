name: Build Laya English INT8

on:
  push:
    branches: [main, feat/laya-english-litellm]
    paths: ['containers/laya/**', '.github/workflows/laya-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: laya-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build and compare INT8 against FP32
        uses: docker/build-push-action@v6
        with:
          context: containers/laya
          load: true
          tags: laya:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test offline runtime with production limits
        run: |
          docker run -d --name laya-test --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 2g -e LAYA_API_KEY=smoke-key laya:test
          docker cp containers/laya/smoke.py laya-test:/tmp/smoke.py
          docker exec laya-test python /tmp/smoke.py
          docker cp laya-test:/opt/laya/validation.json validation.json
          docker stats --no-stream laya-test
          cat validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: laya-quantization-validation
          path: validation.json
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image
        run: |
          docker tag laya:test ghcr.io/noxels/sisyphus-laya-english:sha-${{ github.sha }}
          docker push ghcr.io/noxels/sisyphus-laya-english:sha-${{ github.sha }}
      - name: Diagnostics
        if: always()
        run: docker logs laya-test 2>/dev/null || true

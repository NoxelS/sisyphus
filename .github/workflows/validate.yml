name: Validate infrastructure

on:
  pull_request:
  push:
    branches:
      - main
      - 'flux/**'

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
      - name: Lint YAML
        run: uv run --no-project --with yamllint==1.37.1 yamllint -d relaxed .
      - name: Check Python project metadata
        run: uv run --no-project --with ruff==0.12.10 ruff check .
      - name: Check SOPS configuration
        run: test -s .sops.yaml
      - name: Check MALG deployment consistency
        run: uv run --no-project --with pyyaml python scripts/check_malg_deployment.py
      - name: Check LiteLLM chart and image version
        run: uv run --no-project --with pyyaml python scripts/check_litellm_release.py
      - name: Test MALG deployment checker
        run: uv run --no-project --with pyyaml python -m unittest discover -s tests -p test_malg_deployment.py
